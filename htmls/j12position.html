<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/bootstrap.rtl.min.css">
    <style>
        body{
            padding: 2rem;
        }
        .box-parent {
            width: 500px;
            height: 500px;
        }

        span {
            width: 50px;
            height: 50px;
            display: block;
        }
    </style>

</head>

<body>
    <div class="bg-black box-parent position-relative">
        <span class="bg-success position-absolute bottom-50 start-50"></span>
        <span class="bg-danger position-absolute bottom-0 end-0"></span>
    </div>

</body>

</html>
